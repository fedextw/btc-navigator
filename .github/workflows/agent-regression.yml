name: Agent research regression tests

on:
  pull_request:
  push:
    branches:
      - agent/bc-research-sandbox-20261025
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline agent regression tests
        run: python -m unittest discover -s tests -p "test_agent_*.py" -v
